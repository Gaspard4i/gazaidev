<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gazaidev — Algo Visualizer</title>
  <style>
    :root {
      --bg: #FBF6EE;
      --bg-card: #F5F0E8;
      --orange: #E8621F;
      --orange-soft: #F09A56;
      --navy: #1B3A5C;
      --sky: #A8C8E0;
      --sky-light: #D4E4F0;
      --cream: #FBF6EE;
      --ink: #2A2A2A;
      --ink-soft: #5C5C5C;
      --white: #FFFFFF;
      --stripe: repeating-linear-gradient(
        0deg, transparent, transparent 3px, rgba(168,200,224,0.2) 3px, rgba(168,200,224,0.2) 4px
      );
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      background-image: var(--stripe);
      color: var(--ink);
      font-family: 'Georgia', 'Palatino', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    h1 {
      color: var(--orange);
      font-size: 1.6rem;
      margin-bottom: 14px;
      letter-spacing: 3px;
      font-weight: 700;
      text-shadow: 2px 2px 0 rgba(232,98,31,0.15);
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
      background: var(--bg-card);
      padding: 12px 18px;
      border-radius: 12px;
      border: 2px solid var(--sky);
      box-shadow: 3px 3px 0 var(--sky-light);
    }
    button, select {
      background: var(--navy);
      color: var(--cream);
      border: 2px solid var(--navy);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'Georgia', serif;
      font-weight: 600;
      transition: all 0.15s;
      box-shadow: 2px 2px 0 rgba(27,58,92,0.2);
    }
    button:hover, select:hover {
      background: var(--sky);
      color: var(--navy);
      border-color: var(--navy);
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 rgba(27,58,92,0.25);
    }
    button.rec {
      background: var(--orange);
      border-color: var(--orange);
      box-shadow: 2px 2px 0 rgba(232,98,31,0.3);
    }
    button.rec:hover {
      background: var(--orange-soft);
      color: var(--white);
      border-color: var(--orange);
    }
    button.rec.recording {
      background: #C0392B;
      border-color: #C0392B;
      animation: pulse 1s infinite;
    }
    select optgroup { font-style: italic; color: var(--ink-soft); }
    select option { font-style: normal; color: var(--ink); }
    button.active {
      background: var(--orange);
      border-color: var(--orange);
    }
    button.active:hover {
      background: var(--orange-soft);
      border-color: var(--orange);
      color: var(--white);
    }
    @keyframes pulse { 50% { opacity: 0.7; } }
    .speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--navy);
      font-size: 0.8rem;
      font-weight: 600;
    }
    input[type="range"] {
      width: 80px;
      accent-color: var(--orange);
    }
    canvas {
      border: 3px solid var(--navy);
      border-radius: 10px;
      max-height: 70vh;
      box-shadow: 4px 4px 0 var(--sky);
    }
    .status {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--ink-soft);
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>GAZAIDEV</h1>
  <div class="controls">
    <select id="algo-select">
      <optgroup label="Classiques">
        <option value="bubble">Bubble Sort</option>
        <option value="quick">Quick Sort</option>
        <option value="merge">Merge Sort</option>
      </optgroup>
      <optgroup label="Absurdes">
        <option value="thanos">Thanos Sort</option>
        <option value="stalin">Stalin Sort</option>
        <option value="communism">Communism Sort</option>
        <option value="sort67">67 Sort</option>
        <option value="trump">Trump Sort</option>
        <option value="hitler">Hitler Sort</option>
        <option value="diddy">Diddy Sort</option>
        <option value="epstein">Epstein Sort</option>
        <option value="nineEleven">9/11 Sort</option>
        <option value="unsort">Unsort</option>
        <option value="bogo">Bogo Sort</option>
        <option value="sigma">Sigma Sort</option>
        <option value="gaza">Gaza Sort</option>
        <option value="french">French Sort</option>
      </optgroup>
    </select>
    <select id="mode-select">
      <option value="single">Solo</option>
      <option value="race">Race</option>
    </select>
    <button id="btn-start">Play</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-rec" class="rec">REC</button>
    <button id="btn-loop">Loop</button>
    <button id="btn-rainbow">Rainbow</button>
    <div class="speed-control">
      <label for="speed">Vitesse</label>
      <input type="range" id="speed" min="1" max="20" value="2">
    </div>
  </div>
  <canvas id="canvas" width="1080" height="1920"></canvas>
  <div class="status" id="status">Pret</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
