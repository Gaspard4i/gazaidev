<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Gazaidev — Algo Visualizer</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #161616;
      --orange: #E8621F;
      --orange-soft: #F09A56;
      --navy: #1B3A5C;
      --sky: #A8C8E0;
      --cream: #F5F0E8;
      --ink: #E0E0E0;
      --ink-soft: #888888;
      --border: #2a2a2a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Canvas prend tout l'espace disponible */
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Panel de controles en bas — compact */
    .panel {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .panel-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button {
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: -apple-system, system-ui, sans-serif;
      transition: all 0.1s;
    }
    select { flex: 1; min-width: 0; }
    button:hover { background: var(--navy); border-color: var(--navy); }
    button:active { transform: scale(0.96); }

    button.rec { background: #CC0000; border-color: #CC0000; color: white; }
    button.rec.recording { animation: pulse 1s infinite; }
    button.active { background: var(--orange); border-color: var(--orange); color: white; }
    @keyframes pulse { 50% { opacity: 0.6; } }

    select optgroup { font-weight: 600; }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      color: var(--ink-soft);
    }
    input[type="number"] {
      width: 50px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px;
      font-size: 0.75rem;
      text-align: center;
    }

    .status {
      font-size: 0.65rem;
      color: var(--ink-soft);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="canvas-wrap">
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>

  <div class="panel">
    <div class="panel-row">
      <select id="algo-select">
        <optgroup label="O(n²) — Classiques">
          <option value="bubble">Bubble Sort</option>
          <option value="selection">Selection Sort</option>
          <option value="insertion">Insertion Sort</option>
          <option value="cocktail">Cocktail Sort</option>
          <option value="gnome">Gnome Sort</option>
          <option value="oddEven">Odd-Even Sort</option>
          <option value="cycle">Cycle Sort</option>
          <option value="pancake">Pancake Sort</option>
        </optgroup>
        <optgroup label="O(n log n) — Performants">
          <option value="quick">Quick Sort</option>
          <option value="merge">Merge Sort</option>
          <option value="heap">Heap Sort</option>
          <option value="shell">Shell Sort</option>
          <option value="comb">Comb Sort</option>
          <option value="tim">Tim Sort</option>
          <option value="dualPivot">Dual Pivot QS</option>
          <option value="bitonic">Bitonic Sort</option>
          <option value="patience">Patience Sort</option>
        </optgroup>
        <optgroup label="O(n) — Lineaires">
          <option value="counting">Counting Sort</option>
          <option value="radix">Radix Sort</option>
          <option value="bucket">Bucket Sort</option>
        </optgroup>
        <optgroup label="Exotiques">
          <option value="stooge">Stooge Sort</option>
          <option value="slow">Slow Sort</option>
          <option value="sleep">Sleep Sort</option>
          <option value="strand">Strand Sort</option>
          <option value="bogo">Bogo Sort</option>
          <option value="unsort">Unsort</option>
        </optgroup>
        <optgroup label="Absurdes">
          <option value="thanos">Thanos Sort</option>
          <option value="stalin">Stalin Sort</option>
          <option value="communism">Communism Sort</option>
          <option value="sort67">67 Sort</option>
          <option value="trump">Trump Sort</option>
          <option value="hitler">Hitler Sort</option>
          <option value="diddy">Diddy Sort</option>
          <option value="epstein">Epstein Sort</option>
          <option value="nineEleven">9/11 Sort</option>
          <option value="sigma">Sigma Sort</option>
          <option value="gaza">Gaza Sort</option>
          <option value="french">French Sort</option>
          <option value="gamble">Gamble Sort</option>
          <option value="adhd">ADHD Sort</option>
          <option value="autism">Autism Sort</option>
          <option value="magician">Magician Sort</option>
          <option value="drug">Drug Sort</option>
          <option value="pong">Pong Sort</option>
          <option value="claude">Claude Sort</option>
          <option value="chatgpt">ChatGPT Sort</option>
        <option value="hiroshima">Hiroshima Sort</option>
          <option value="manual">Manual Sort</option>
          <option value="skibidi">Skibidi Sort</option>
          <option value="hawkTuah">Hawk Tuah Sort</option>
          <option value="rizz">Rizz Sort</option>
          <option value="mewing">Mewing Sort</option>
          <option value="ohio">Ohio Sort</option>
          <option value="brainrot">Brainrot Sort</option>
          <option value="fanumTax">Fanum Tax Sort</option>
          <option value="northKorea">North Korea Sort</option>
          <option value="ukraine">Ukraine Sort</option>
          <option value="elon">Elon Sort</option>
          <option value="npc">NPC Sort</option>
          <option value="diddyIsland">Island Sort</option>
        </optgroup>
        <optgroup label="Jeux vidéo">
          <option value="minecraft">Minecraft Sort</option>
          <option value="valorant">Valorant Sort</option>
          <option value="rocketLeague">Rocket League Sort</option>
          <option value="pokemon">Pokémon Sort</option>
          <option value="gta">GTA Sort</option>
          <option value="fortnite">Fortnite Sort</option>
          <option value="amongUs">Among Us Sort</option>
          <option value="tetris">Tetris Sort</option>
        </optgroup>
        <optgroup label="Jeux de société">
          <option value="chess">Chess Sort</option>
          <option value="monopoly">Monopoly Sort</option>
          <option value="uno">Uno Sort</option>
        </optgroup>
        <optgroup label="Quotidien">
          <option value="plane">Plane Sort</option>
          <option value="boat">Boat Sort</option>
          <option value="car">Car Sort</option>
          <option value="coffee">Coffee Sort</option>
          <option value="ikea">IKEA Sort</option>
          <option value="wifi">WiFi Sort</option>
          <option value="netflix">Netflix Sort</option>
          <option value="tinder">Tinder Sort</option>
          <option value="prison">Prison Sort</option>
          <option value="liberty">Liberty Sort</option>
          <option value="breakingBad">Breaking Bad Sort</option>
        </optgroup>
      </select>
      <button id="btn-start">Play</button>
      <button id="btn-reset">Reset</button>
      <a href="preview.html" style="text-decoration:none"><button type="button" style="background:#1B3A5C;">Preview</button></a>
    </div>
    <div class="panel-row">
      <button id="btn-loop">Loop</button>
      <button id="btn-rainbow">Rainbow</button>
      <select id="speed-mode">
        <option value="stable">Stable</option>
        <option value="accelerate">Accelere</option>
        <option value="decelerate">Ralentit</option>
      </select>
      <div class="ctrl-group">
        <label>Spd</label>
        <input type="number" id="speed" min="0.05" max="100" value="0.15" step="0.05">
      </div>
      <div class="ctrl-group">
        <label>Bars</label>
        <input type="number" id="bars" min="3" max="500" value="80" step="1">
      </div>
    </div>
    <div class="status" id="status">Pret</div>
  </div>

  <select id="mode-select" style="display:none">
    <option value="single">Solo</option>
    <option value="race">Race</option>
  </select>

  <script type="module" src="src/main.js"></script>
</body>
</html>
